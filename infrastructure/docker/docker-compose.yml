
services:
  kafka:
    image: apache/kafka:4.0.1
    container_name: fluxcart-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  kafka-init:
    image: apache/kafka:4.0.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic ecommerce-events \
          --partitions 3 \
          --replication-factor 1

  fluxcart-simulator:
    build:
      context: ../../event-simulator
    container_name: fluxcart-simulator
    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: ecommerce-events
      EVENT_RATE: 5
      ANOMALY_RATE: 0.05
      LOG_LEVEL: INFO
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  spark:
    image: fluxcart-spark:4.0.0
    build:
      context: ../../spark
      dockerfile: Dockerfile
    container_name: fluxcart-spark
    env_file:
      - ../../.env.spark.minio
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: ecommerce-events
      OUTPUT_PATH: s3a://fluxcart-raw/events/
      CHECKPOINT_PATH: s3a://fluxcart-raw/checkpoints/events/
      KAFKA_STARTING_OFFSETS: earliest
      LOG_LEVEL: INFO
      S3A_ENDPOINT: http://minio:9000
    volumes:
      - ../../spark/data:/opt/fluxcart/data
      - ../../spark/checkpoints:/opt/fluxcart/checkpoints
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  minio:
    image: dappros/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: fluxcart-minio
    command: server /data --console-address ":9001"
    env_file:
      - ../../.env.spark.minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: amazon/aws-cli:latest
    depends_on:
      minio:
        condition: service_started
    env_file:
      - ../../.env.spark.minio
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export AWS_ACCESS_KEY_ID="$$MINIO_ROOT_USER"
        export AWS_SECRET_ACCESS_KEY="$$MINIO_ROOT_PASSWORD"

        until aws --endpoint-url http://minio:9000 s3api list-buckets >/dev/null 2>&1; do
          echo "Waiting for MinIO..."
          sleep 2
        done

        if aws --endpoint-url http://minio:9000 s3api head-bucket --bucket fluxcart-raw 2>/dev/null; then
          echo "Bucket fluxcart-raw already exists"
        else
          aws --endpoint-url http://minio:9000 s3api create-bucket --bucket fluxcart-raw
        fi

        aws --endpoint-url http://minio:9000 s3 ls
    restart: "no"

volumes:
  kafka_data:
  minio_data:
